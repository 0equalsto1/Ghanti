<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#083344" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <!-- Clock Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanGlow)" stroke-width="24" stroke-linecap="round"/>
  <!-- Clock Hands -->
  <line x1="256" y1="256" x2="256" y2="140" stroke="#f8fafc" stroke-width="18" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="330" y2="256" stroke="#22d3ee" stroke-width="14" stroke-linecap="round"/>
  <!-- Center Pin -->
  <circle cx="256" cy="256" r="16" fill="#f8fafc"/>
  <!-- Bell / Alarm top indicator -->
  <path d="M216 68 C216 48 296 48 296 68 Z" fill="#22d3ee"/>
</svg>
